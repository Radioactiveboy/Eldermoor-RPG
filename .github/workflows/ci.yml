name: CI

# Type-check, build, unit tests and the smoke test, on every pull request and push.
# (Publishing to GitHub Pages is separate: see deploy.yml.)
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Build and smoke test every area
        run: npm run test:smoke
